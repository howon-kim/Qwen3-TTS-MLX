name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: macos-14
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . --no-deps
      - run: python -m pip install "gradio>=6,<7" numpy scipy soundfile pytest ruff
      - run: ruff check .
      - run: pytest
      - run: python -c "from qwen_tts_mlx.app import build_demo; assert build_demo().config"
